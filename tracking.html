<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>J&T Tracking | 2FLY</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script defer src="./common.js"></script>
  <script defer src="./tracking.js"></script>
</head>
<body data-page="tracking" data-required-role="team" data-required-permission="update_tracking">
  <div id="toast" class="toast"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo small">2F</div>
        <div>
          <strong>2FLY Daily Ops</strong>
          <span>Orders • Tracking</span>
        </div>
      </div>
      <nav></nav>
      <div class="side-user">
        <span id="userEmail">—</span>
        <strong id="userRole">—</strong>
        <button id="logoutBtn" class="btn ghost">Log out</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <h2>J&amp;T Tracking</h2>
          <p>J&amp;T orders only. Add or update the tracking number here.</p>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>
      </header>

      <main class="page">
        <article class="card">
          <div class="card-head filters-head">
            <div>
              <h3>J&amp;T Orders</h3>
              <p>Only order number, customer name, and J&amp;T tracking number are shown.</p>
            </div>
            <div class="filter-row">
              <input id="trackingSearch" placeholder="Search order number, name, or tracking number">
            </div>
          </div>
          <div class="table-wrap" id="trackingTable">
            <div class="empty">Loading J&amp;T orders…</div>
          </div>
        </article>
      </main>
    </section>
  </div>
</body>
</html>
