<!doctype html><meta charset="utf-8"><title>2FLY VAPID Key Generator</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px}textarea{width:100%;height:90px}button{padding:10px 16px}</style><h1>2FLY Web Push key generator</h1><p>Runs only in this browser. Do not upload or commit the private key.</p><button id="go">Generate keys</button><h3>VAPID_PUBLIC_KEY</h3><textarea id="pub" readonly></textarea><h3>VAPID_PRIVATE_KEY (Cloudflare secret)</h3><textarea id="priv" readonly></textarea><script>
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
go.onclick=async()=>{const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const raw=await crypto.subtle.exportKey('raw',kp.publicKey);const jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);pub.value=b64u(raw);priv.value=jwk.d;};
</script>
