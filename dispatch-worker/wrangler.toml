name = "twofly-dispatch-photos"
main = "worker.mjs"
compatibility_date = "2026-11-01"
keep_vars = true

# IMPORTANT: replace only the database_id with the ID of your EXISTING
# 2fly-dispatch-db. Do not create a second D1 database.
[[d1_databases]]
binding = "DB"
database_name = "2fly-dispatch-db"
database_id = "39fedaf5-11d3-4196-95ec-7d54ddc5519d"

# Reuse the EXISTING private bucket.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "2fly-dispatch-photos"

[vars]
# Keep the standalone tracker's existing Netlify origin in ALLOWED_ORIGIN.
ALLOWED_ORIGIN = "https://2flynumbers.netlify.app"
# Integrated 2FLY Numbers origin. Multiple origins can be comma-separated later.
ALLOWED_ORIGINS = "https://2flynumbers.netlify.app"
# Use the current 2FLY Numbers Supabase URL. Do not commit the anon key here.
SUPABASE_URL = "https://yzzqhenrbzapnpsgwngu.supabase.co/"
# Start false. Enable only after the integrated flow has been checked in production.
CLEANUP_ENABLED = "false"
[triggers]
crons = ["*/10 * * * *"]